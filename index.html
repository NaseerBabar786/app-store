<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icons/store-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/store-icon-512.png">
<title>App Bazaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: Play-store structure and look. White sticky header (mark, Apps/Games/TV tabs with green underline, search), outlined view chips, featured banner carousel, horizontal app rows, ranked top chart; app page with green Install button, gallery and "More apps" sidebar. Single light theme */
:root{
  --bg:#ffffff; --soft:#f1f3f4; --ink:#202124; --muted:#5f6368; --line:#dadce0;
  --green:#01875f; --green-dark:#056449; --green-soft:#e6f3ef; --hover:rgba(32,33,36,.06);
  --font:Roboto,Arial,sans-serif; --display:"Product Sans","Google Sans",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px/1.43 var(--font);letter-spacing:.0142em}
a{color:inherit}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font);font-weight:500;text-wrap:balance;letter-spacing:0}
p{margin:0}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:24px}

/* header */
.topbar{background:var(--bg);color:var(--ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:40;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
.topbar .wrap{display:flex;align-items:center;gap:32px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--muted);flex:none}
.logo img{width:36px;height:36px;display:block}
.logo span{font:500 1.375rem/1 var(--font);letter-spacing:0;color:#1b2a35}
.logo b{font-weight:500;color:#12999c}
.tabs{display:flex;gap:8px;align-self:stretch}
.tab{background:none;border:0;color:var(--muted);font-weight:500;font-size:.875rem;padding:0 12px;cursor:pointer;border-bottom:3px solid transparent;border-top:3px solid transparent;border-radius:0}
.tab:hover{color:var(--ink);background:var(--hover)}
.tab[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green)}
.search{margin-left:auto;display:flex;align-items:center;background:var(--soft);border-radius:8px;padding:0 6px 0 14px;flex:0 1 360px;min-width:0;border:1px solid transparent}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;background:none;padding:.7rem .6rem;min-width:0;flex:1}
.search input:focus{outline:none}
.search:focus-within{background:var(--bg);border-color:var(--line);box-shadow:0 1px 2px rgba(60,64,67,.3)}

/* view chips */
.views{background:var(--bg)}
.views .wrap{display:flex;gap:8px;padding-block:20px 4px;overflow-x:auto;scrollbar-width:none}
.vchip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 16px;height:32px;font-weight:500;font-size:.875rem;cursor:pointer;color:var(--muted)}
.vchip:hover{background:var(--hover)}
.vchip[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green-soft);color:var(--green-dark)}

main{padding-block:20px 48px;display:grid;gap:40px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-head h2{font-size:1.375rem;line-height:1.75rem;font-family:var(--display)}
.sec-head p{color:var(--muted);font-size:.875rem}
.arrows{display:flex;gap:8px}
.arrow{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--muted);box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
.arrow:hover{background:var(--soft)}
.arrow svg{width:20px;height:20px}

/* scrolling rows */
.row{display:grid;grid-auto-flow:column;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.row::-webkit-scrollbar{display:none}
.row>*{scroll-snap-align:start}
.hero-row{grid-auto-columns:min(560px,86%)}
.card-row{grid-auto-columns:min(300px,72%)}

.hero{position:relative;display:block;border-radius:12px;overflow:hidden;aspect-ratio:1024/500;text-decoration:none;color:#fff;background:var(--c,#202124)}
.hero img.bn{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.hero:hover img.bn{transform:scale(1.02)}
.hero .over{position:absolute;inset:auto 0 0 0;padding:70px 16px 16px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.65) 45%,rgba(0,0,0,.85));display:flex;align-items:center;gap:12px}
.hero .over .t{min-width:0;flex:1}
.hero .over b{display:block;font-size:1rem;font-weight:500}
.hero .over small{color:rgba(255,255,255,.8);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8125rem}
.hero .get{background:var(--green);color:#fff;font-weight:500;border-radius:8px;padding:.5rem 1.4rem;font-size:.875rem;flex:none}

.card{display:grid;gap:12px;text-decoration:none;min-width:0;border-radius:12px}
.card .thumb{border-radius:12px;overflow:hidden;aspect-ratio:1024/500;background:var(--c,#202124)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.card:hover .thumb img{transform:scale(1.03)}
.card .info{display:flex;gap:12px;align-items:center;min-width:0}
.card .info div{min-width:0}
.card b{display:block;font-weight:400;font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--muted);font-size:.8125rem;display:block}

.icon{flex:none;width:56px;height:56px;border-radius:20%;background:var(--c);color:#fff;display:grid;place-items:center;font:500 26px var(--font);overflow:hidden;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
.icon img{width:100%;height:100%;object-fit:cover}
.icon.s{width:48px;height:48px;font-size:22px}
.icon.xl{width:120px;height:120px;font-size:56px}

/* TV apps: a card per TV app with its Downloader code */
.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.tvcard{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:12px;min-width:0}
.tvcard .t{min-width:0}
.tvcard .t b{display:block;font-size:1rem;font-weight:500}
.tvcard .t small{color:var(--muted);font-size:.8125rem;display:block}
.tvcard .code{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:10px 12px}
.tvcard .code span{color:var(--muted);font-size:.8125rem}
.tvcard .code b,.tvcode b{font:500 1.125rem/1.2 var(--font);letter-spacing:.02em;color:var(--ink);word-break:break-all}
.tvcard .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.tvcard .acts a{text-decoration:none;font-weight:500;font-size:.875rem;border-radius:8px;padding:.5rem 1.2rem}
.tvcard .acts .go{background:var(--green);color:#fff}
.tvcard .acts .more{border:1px solid var(--line);color:var(--green-dark)}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 10px;font-size:.75rem;cursor:pointer;color:var(--muted);margin-left:auto}
.copy:hover{background:var(--hover)}
.tvhow{border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin-top:16px}
.tvhow summary{cursor:pointer;font-weight:500;padding:10px 0;color:var(--green-dark)}
.tvhow ol{margin:0 0 14px;padding-left:20px;display:grid;gap:6px;color:var(--ink)}
.tvhow li{line-height:1.5}
.tvcode{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:12px 14px;margin-top:10px}

/* top chart */
.ctabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chart{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 24px}
.rank{display:flex;align-items:center;gap:16px;padding:8px;border-radius:8px;text-decoration:none;min-width:0}
.rank:hover{background:var(--hover)}
.rank .n{width:20px;text-align:center;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.rank .t{min-width:0}
.rank b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank small{color:var(--muted);font-size:.8125rem;display:block}
.free{color:var(--muted);font-size:.8125rem}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.catcard{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;text-align:left;color:var(--ink)}
.catcard:hover{background:var(--hover)}
.catcard b{font-weight:500}
.catcard small{color:var(--muted)}
.catcard svg{width:20px;height:20px;color:var(--muted)}

.empty{border:1px solid var(--line);border-radius:12px;padding:40px 24px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}
.empty b{color:var(--ink);font-size:1.1rem;font-weight:500}

/* app page */
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:start}
.ahead{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.ahead h1{font-family:var(--display);font-size:clamp(2rem,5vw,3.5rem);line-height:1.1;font-weight:500}
.ahead .dev{color:var(--green);font-weight:500;font-size:1rem;margin-top:12px}
.ahead .tag{color:var(--muted);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;margin-block:24px}
.stat{padding:0 24px;border-left:1px solid var(--line);display:grid;justify-items:center;gap:2px;text-align:center}
.stat:first-child{padding-left:0;border-left:0}
.stat b{font-weight:500;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.75rem}
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.install{background:var(--green);color:#fff;border:0;border-radius:8px;height:44px;padding:0 56px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;font-size:.875rem}
.install:hover{background:var(--green-dark);box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
.ghost{background:none;border:0;color:var(--green);font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;padding:0 12px;height:40px;border-radius:8px;font-size:.875rem}
.ghost:hover{background:var(--green-soft)}
.ghost svg{width:20px;height:20px}
.toast{color:var(--muted);font-size:.8125rem}
.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:min(480px,85%);gap:12px;overflow-x:auto;scrollbar-width:thin;margin-top:32px}
.gallery img{width:100%;border-radius:8px;display:block;border:1px solid var(--line)}
.block{margin-top:36px;display:grid;gap:12px;max-width:65ch}
.block h2{font-family:var(--display);font-size:1.375rem}
.block p{color:var(--muted);line-height:1.5}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:8px;padding:0 12px;height:32px;display:inline-flex;align-items:center;font-size:.875rem;color:var(--muted);font-weight:500}
.side h2{font-family:var(--display);font-size:1.375rem;margin-bottom:12px}
.side .rank .n{display:none}

/* account */
.acct{position:relative;flex:none}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--green);color:#fff;font-weight:500;font-size:1.05rem;cursor:pointer;display:grid;place-items:center}
.avatar:hover{box-shadow:0 0 0 4px var(--hover)}
.avatar svg{width:24px;height:24px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:var(--bg);border-radius:12px;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);padding:8px 0;z-index:60}
.menu .who{display:flex;gap:14px;align-items:center;padding:12px 20px 16px;border-bottom:1px solid var(--line)}
.menu .who .avatar{width:44px;height:44px;cursor:default}
.menu .who b{display:block;font-weight:500}
.menu .who small{color:var(--muted);font-size:.8125rem}
.menu .signin{margin:12px 20px 4px;display:grid;gap:6px}
.menu .signin button{border:1px solid var(--line);background:var(--bg);border-radius:999px;height:36px;font-weight:500;color:var(--ink);cursor:pointer}
.menu .signin button:hover{background:var(--hover)}
.menu .signin small{color:var(--muted);font-size:.75rem;text-align:center}
.menu a,.menu .mi{display:flex;align-items:center;gap:18px;padding:12px 24px;text-decoration:none;color:var(--ink);background:none;border:0;width:100%;text-align:left;cursor:pointer;font-size:.875rem}
.menu a:hover,.menu .mi:hover{background:var(--hover)}
.menu svg{width:22px;height:22px;color:var(--muted);flex:none}
.menu .cnt{margin-left:auto;color:var(--muted);font-size:.8125rem}
.menu hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.menu .fine{padding:4px 24px 8px;color:var(--muted);font-size:.75rem}
.badge{display:inline-block;background:var(--green-soft);color:var(--green-dark);border-radius:6px;padding:1px 8px;font-size:.75rem;font-weight:500;margin-top:2px}
.libnote{color:var(--muted);font-size:.875rem;margin-top:-8px;margin-bottom:12px}
.rowact{margin-left:auto;flex:none}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.8125rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:24px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:900px){.app{grid-template-columns:1fr}}
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .acct{margin-left:auto}
  .topbar .wrap{flex-wrap:wrap;gap:0 16px;padding-top:8px}
  .logo span{display:none}
  .search{order:3;flex:1 1 100%;margin:8px 0 10px}
  .tabs{min-height:48px}
  .arrows{display:none}
  .ahead .icon.xl{width:72px;height:72px;font-size:34px}
  .stat{padding:0 14px}
  .install{flex:1;justify-content:center;padding:0 24px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="logo" href="#" aria-label="App Bazaar home"><img src="icons/store-icon.svg" alt="" width="36" height="36"><span>App <b>Bazaar</b></span></a>
    <nav class="tabs" role="tablist" aria-label="Store sections">
      <button class="tab" role="tab" data-tab="app" aria-selected="true">Apps</button>
      <button class="tab" role="tab" data-tab="game" aria-selected="false">Games</button>
      <button class="tab" role="tab" data-tab="tv" aria-selected="false">TV apps</button>
    </nav>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      <input id="q" type="search" placeholder="Search for apps &amp; games" aria-label="Search for apps and games" autocomplete="off"></label>
    <div class="acct">
      <button class="avatar" id="acctBtn" aria-haspopup="true" aria-expanded="false" aria-label="Your account"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg></button>
      <div class="menu" id="menu" hidden>
        <div class="who"><span class="avatar" id="whoAvatar"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg></span><span><b id="whoName">Guest</b><small id="whoSub">Saved on this device only</small></span></div>
        <div class="signin"><button id="signinBtn" type="button">Sign in with Google</button><button id="signoutBtn" type="button" hidden>Sign out</button><small id="signinNote">Sign in to keep My apps and Wishlist on all your devices.</small></div>
        <hr>
        <a href="#library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>My apps &amp; updates<span class="cnt" id="libCount"></span></a>
        <a href="#wishlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Wishlist<span class="cnt" id="wishCount"></span></a>
        <a href="help.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>Help &amp; user guide</a>
        <hr>
        <button class="mi" id="clearData" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Clear my list on this device</button>
        <p class="fine" id="clearNote"></p>
      </div>
    </div>
  </div>
</div>
<div class="views" id="views">
  <div class="wrap">
    <button class="vchip" data-view="foryou" aria-pressed="true">For you</button>
    <button class="vchip" data-view="charts" aria-pressed="false">Top charts</button>
    <button class="vchip" data-view="categories" aria-pressed="false">Categories</button>
  </div>
</div>
<main class="wrap" id="view"></main>
<footer><div class="wrap"><span>© 2026 App Bazaar</span><span>Free apps for Android phones, tablets and TVs · <a href="help.html" style="color:inherit">Help &amp; user guide</a></span></div></footer>

<script src="firebase-config.js"></script>
<script>
// Paid apps: set "price" (e.g. "$2.99") and links.buy (the checkout page). The APK link stays with the payment service, never in apps.json.
const isPaid = a => !!a.price;
const priceOf = a => a.price ? esc(a.price) : 'Free';
const LINK_LABELS = { android: 'Install', web: 'Open web app', ios: 'Get for iPhone', windows: 'Download for Windows', mac: 'Download for Mac', source: 'Source code' };
const TAB_NAMES = { app: 'apps', game: 'games', tv: 'TV apps' };
let DATA = { store: {}, apps: [] }, tab = 'app', view = 'foryou', cat = null, chart = 'free', query = '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'bbas-account';
const PERSON_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>';
function loadAcct() { try { return Object.assign({ library: {}, wishlist: [] }, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { return { library: {}, wishlist: [] }; } }
let ACCT = loadAcct();
function saveAcct() { try { localStorage.setItem(KEY, JSON.stringify(ACCT)); } catch {} updateCounts(); pushCloud(); }
function updateCounts() {
  const l = Object.keys(ACCT.library).filter(id => DATA.apps.some(a => a.id === id)).length, w = ACCT.wishlist.filter(id => DATA.apps.some(a => a.id === id)).length;
  $('#libCount').textContent = l || ''; $('#wishCount').textContent = w || '';
}
const hasUpdate = a => ACCT.library[a.id] && ACCT.library[a.id].version !== a.version;
const ARROW = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d === 'l' ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}"/></svg>`;

function icon(a, cls = '') {
  const inner = a.icon?.image ? `<img src="${esc(a.icon.image)}" alt="">` : esc(a.icon?.letter || a.name[0]);
  return `<span class="icon ${cls}" style="--c:${esc(a.icon?.color || '#0a3d55')}">${inner}</span>`;
}
const isTV = a => a.platforms.some(p => /TV/i.test(p));
const inTab = a => tab === 'tv' ? isTV(a) : (a.type || 'app') === tab;
const fmtDate = d => { try { return new Date(d + 'T00:00').toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch { return d; } };
const meta = a => `${esc(a.category)} · ${isTV(a) ? 'Phone & TV' : esc(a.platforms[0])}`;

function section(title, sub, body, rowId) {
  return `<section><div class="sec-head"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>
    ${rowId ? `<div class="arrows"><button class="arrow" data-scroll="${rowId}" data-dir="-1" aria-label="Scroll left">${ARROW('l')}</button><button class="arrow" data-scroll="${rowId}" data-dir="1" aria-label="Scroll right">${ARROW('r')}</button></div>` : ''}</div>${body}</section>`;
}
const heroCard = a => `<a class="hero" href="#${esc(a.id)}" style="--c:${esc(a.icon?.color)}">${a.banner ? `<img class="bn" src="${esc(a.banner)}" alt="">` : ''}
  <div class="over">${icon(a, 's')}<div class="t"><b>${esc(a.name)}</b><small>${meta(a)}</small></div><span class="get">${priceOf(a)}</span></div></a>`;
const card = a => `<a class="card" href="#${esc(a.id)}"><div class="thumb" style="--c:${esc(a.icon?.color)}">${a.banner ? `<img src="${esc(a.banner)}" alt="" loading="lazy">` : ''}</div>
  <div class="info">${icon(a, 's')}<div><b>${esc(a.name)}</b><small>${meta(a)}</small></div></div></a>`;
const rank = (a, i) => `<a class="rank" href="#${esc(a.id)}"><span class="n">${i + 1}</span>${icon(a)}<span class="t"><b>${esc(a.name)}</b><small>${esc(a.category)}</small><span class="free">${priceOf(a)}</span></span></a>`;
// TV apps: each app's Downloader code ("tvCode" in apps.json), typed in the Downloader app on a TV.
const copyBtn = t => `<button class="copy" data-copy="${esc(t)}">Copy</button>`;
const tvCard = a => `<div class="tvcard">${icon(a, 's')}<a class="t" href="#${esc(a.id)}" style="text-decoration:none"><b>${esc(a.name)}</b><small>${esc(a.tagline)}</small></a>
  <div class="code"><span>On a TV, type in Downloader:</span><b>${esc(a.tvCode)}</b>${copyBtn(a.tvCode)}</div>
  <div class="acts"><a class="go" href="${esc(a.links?.android || '#' + a.id)}" data-dl="${esc(a.id)}" target="_blank" rel="noopener">Install on this device</a><a class="more" href="#${esc(a.id)}">About the app</a></div></div>`;
const TV_STEPS = `<details class="tvhow"><summary>How to install an app on Google TV, Android TV or Fire TV</summary><ol>
  <li>On the TV, search for <b>Downloader</b> (by AFTVnews, orange icon) and install it. You only do this once.</li>
  <li>Allow it to install apps, once: <b>Settings › System › About</b>, press <b>OK</b> on <b>Android TV OS build</b> 7 times, then <b>Settings › Apps › Security &amp; restrictions › Unknown sources</b> and turn on <b>Downloader</b>. On Fire TV: <b>Settings › My Fire TV › Developer options › Install unknown apps</b>.</li>
  <li>Open <b>Downloader</b>, type the app's code shown above (for example <b>tv.bulkbazaar.ca/max</b>) and press <b>Go</b>.</li>
  <li>When the download finishes, press <b>Install</b>. If Play Protect warns you, choose <b>Install anyway</b>. Then press <b>Open</b>.</li>
</ol></details>`;
function tvSection(list, steps) {
  const tv = list.filter(a => isTV(a) && a.tvCode);
  if (!tv.length) return '';
  return section('TV apps', 'Made for Google TV, Android TV and Fire TV remotes. Each one also works on phones.', `<div class="tvgrid">${tv.map(tvCard).join('')}</div>${steps ? TV_STEPS : ''}`);
}
const empty = (t, s) => `<div class="empty"><b>${t}</b><span>${s}</span></div>`;

function renderForYou(list) {
  if (!list.length) return empty(`No ${TAB_NAMES[tab]} yet`, tab === 'game' ? 'Our first game is on the way. Check back soon.' : 'New apps will show up here.');
  const feats = list.filter(a => a.featured);
  const newest = [...list].sort((a, b) => b.updated.localeCompare(a.updated));
  let html = '';
  if (tab === 'tv') html += tvSection(list, true);
  if (feats.length) html += `<section><div class="row hero-row" id="r-hero">${feats.map(heroCard).join('')}</div></section>`;
  if (tab === 'app') html += tvSection(DATA.apps, false);
  html += section('Recommended for you', '', `<div class="row card-row" id="r-rec">${list.map(card).join('')}</div>`, 'r-rec');
  const free = list.filter(a => !isPaid(a)), paid = list.filter(isPaid);
  if (free.length) html += section('Top free ' + TAB_NAMES[tab], '', `<div class="chart">${free.map(rank).join('')}</div>`);
  if (paid.length) html += section('Top paid ' + TAB_NAMES[tab], '', `<div class="chart">${paid.map(rank).join('')}</div>`);
  if (list.length > 4) html += section('New &amp; updated', 'Fresh versions of our apps', `<div class="row card-row" id="r-new">${newest.map(card).join('')}</div>`, 'r-new');
  const tv = list.filter(isTV);
  if (tab !== 'tv' && tv.length && tv.length < list.length) html += section('Made for your TV', 'Works with Android TV and Google TV remotes', `<div class="row card-row" id="r-tv">${tv.map(card).join('')}</div>`, 'r-tv');
  return html;
}

function renderCharts(list) {
  const sorts = { free: ['Top free', l => l.filter(a => !isPaid(a))], ...(list.some(isPaid) ? { paid: ['Top paid', l => l.filter(isPaid)] } : {}), new: ['Newest', l => [...l].sort((a, b) => b.updated.localeCompare(a.updated))], tv: ['Top on TV', l => l.filter(isTV)] };
  const l = (sorts[chart] || sorts.free)[1](list);
  return `<section><div class="ctabs">${Object.entries(sorts).map(([k, [n]]) => `<button class="vchip" data-chart="${k}" aria-pressed="${k === chart}">${n}</button>`).join('')}</div>
    ${l.length ? `<div class="chart">${l.map(rank).join('')}</div>` : empty(`No ${TAB_NAMES[tab]} here yet`, 'Check back soon.')}</section>`;
}

function renderCategories(list) {
  if (cat) {
    const l = list.filter(a => a.category === cat);
    return section(esc(cat), `<button class="ghost" data-cat="">← All categories</button>`, l.length ? `<div class="chart">${l.map(rank).join('')}</div>` : empty('Nothing here yet', ''));
  }
  const counts = {};
  list.forEach(a => counts[a.category] = (counts[a.category] || 0) + 1);
  const keys = Object.keys(counts).sort();
  return section('Categories', '', keys.length ? `<div class="cats">${keys.map(k => `<button class="catcard" data-cat="${esc(k)}"><span><b>${esc(k)}</b><br><small>${counts[k]} app${counts[k] > 1 ? 's' : ''}</small></span>${ARROW('r')}</button>`).join('')}</div>` : empty('No categories yet', ''));
}

function renderSearch() {
  const q = query.trim().toLowerCase();
  const l = DATA.apps.filter(a => [a.name, a.tagline, a.category, a.description].join(' ').toLowerCase().includes(q));
  return section(`Results for “${esc(query.trim())}”`, `${l.length} found`, l.length ? `<div class="chart">${l.map(rank).join('')}</div>` : empty('No matches', 'Try another word, like “TV” or “camera”.'));
}

function renderLibrary() {
  $('#views').hidden = true;
  const l = DATA.apps.filter(a => ACCT.library[a.id]);
  const ups = l.filter(hasUpdate);
  const row = a => `<div class="rank">${icon(a)}<a class="t" href="#${esc(a.id)}" style="text-decoration:none"><b>${esc(a.name)}</b><small>Downloaded v${esc(ACCT.library[a.id].version)} on ${esc(fmtDate(ACCT.library[a.id].date))}</small>${hasUpdate(a) ? `<span class="badge">Update to v${esc(a.version)}</span>` : '<small>Up to date</small>'}</a>
    ${hasUpdate(a) && a.links?.android ? `<a class="install rowact" style="padding:0 20px" href="${esc(a.links.android)}" data-dl="${esc(a.id)}" target="_blank" rel="noopener">Update</a>` : ''}</div>`;
  $('#view').innerHTML = section('My apps &amp; updates', ups.length ? `${ups.length} update${ups.length > 1 ? 's' : ''} available` : '', `<p class="libnote">Apps you downloaded from this store on this device.</p>` +
    (l.length ? `<div class="chart">${l.map(row).join('')}</div>` : empty('No apps yet', 'Apps you install from the store will show up here, with a note when an update is out.')));
}
function renderWishlist() {
  $('#views').hidden = true;
  const l = DATA.apps.filter(a => ACCT.wishlist.includes(a.id));
  $('#view').innerHTML = section('Wishlist', '', l.length ? `<div class="chart">${l.map(rank).join('')}</div>` : empty('Your wishlist is empty', 'Tap “Add to wishlist” on any app to save it here.'));
}

function renderHome() {
  $('#views').hidden = false;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  document.querySelectorAll('#views .vchip').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
  const list = DATA.apps.filter(inTab);
  $('#view').innerHTML = query.trim() ? renderSearch() : view === 'charts' ? renderCharts(list) : view === 'categories' ? renderCategories(list) : renderForYou(list);
}

function renderApp(a) {
  $('#views').hidden = true;
  const links = Object.entries(a.links || {}).filter(([k]) => k !== 'buy' && !(isPaid(a) && k === 'android'));
  const [first, ...rest] = isPaid(a) && a.links?.buy ? [['buy', a.links.buy], ...links] : links;
  const more = DATA.apps.filter(x => x.id !== a.id);
  const shots = a.screenshots?.length ? a.screenshots : a.banner ? [a.banner] : [];
  $('#view').innerHTML = `<div class="app"><div>
    <div class="ahead"><div><h1>${esc(a.name)}</h1><div class="dev">${esc(DATA.store.developer || '')}</div><div class="tag">${esc(a.tagline)}</div></div>${icon(a, 'xl')}</div>
    <div class="stats">
      <div class="stat"><b>${priceOf(a)}</b><small>${isPaid(a) ? 'One-time purchase' : 'No ads, no sign-up'}</small></div>
      <div class="stat"><b>${esc(a.version)}</b><small>Version</small></div>
      <div class="stat"><b>${esc(a.category)}</b><small>Category</small></div>
      <div class="stat"><b>${isTV(a) ? 'Phone + TV' : esc(a.platforms[0])}</b><small>${esc(a.platforms.join(', '))}</small></div>
    </div>
    <div class="btns">
      ${first ? `<a class="install" href="${esc(first[1])}" ${first[0] === 'android' ? `data-dl="${esc(a.id)}"` : ''} target="_blank" rel="noopener">${first[0] === 'buy' ? `Buy ${esc(a.price)}` : first[0] === 'android' && ACCT.library[a.id] ? (hasUpdate(a) ? 'Update' : 'Install again') : esc(LINK_LABELS[first[0]] || first[0])}</a>` : ''}
      ${rest.map(([k, u]) => `<a class="ghost" href="${esc(u)}" target="_blank" rel="noopener">${esc(LINK_LABELS[k] || k)}</a>`).join('')}
      <button class="ghost" id="wish" aria-pressed="${ACCT.wishlist.includes(a.id)}"><svg viewBox="0 0 24 24" fill="${ACCT.wishlist.includes(a.id) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>${ACCT.wishlist.includes(a.id) ? 'On wishlist' : 'Add to wishlist'}</button>
      <button class="ghost" id="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Share</button>
      <span class="toast" id="toast" aria-live="polite"></span>
    </div>
    ${shots.length ? `<div class="gallery">${shots.map(s => `<img src="${esc(s)}" alt="${esc(a.name)} preview" loading="lazy">`).join('')}</div>` : ''}
    <div class="block"><h2>About this app</h2><p>${esc(a.description)}</p>
      <div class="pills"><span class="pill">${esc(a.category)}</span>${a.platforms.map(p => `<span class="pill">${esc(p)}</span>`).join('')}</div></div>
    ${isTV(a) && a.tvCode ? `<div class="block"><h2>Install on a TV</h2><p>Open the <b>Downloader</b> app on your TV and type:</p><div class="tvcode"><b>${esc(a.tvCode)}</b>${copyBtn(a.tvCode)}</div>${TV_STEPS}</div>` : ''}
    ${a.whatsNew ? `<div class="block"><h2>What's new</h2><p>${esc(a.whatsNew)}</p><small class="toast">Updated on ${esc(fmtDate(a.updated))}</small></div>` : ''}
  </div>
  <aside class="side">${more.length ? `<h2>More apps</h2>${more.map(rank).join('')}` : ''}</aside></div>`;
  $('#share').addEventListener('click', () => {
    const url = location.href;
    navigator.clipboard?.writeText(url).then(() => $('#toast').textContent = 'Link copied', () => $('#toast').textContent = url)
      ?? ($('#toast').textContent = url);
  });
  $('#wish').addEventListener('click', () => {
    ACCT.wishlist = ACCT.wishlist.includes(a.id) ? ACCT.wishlist.filter(x => x !== a.id) : [...ACCT.wishlist, a.id];
    saveAcct(); const y = scrollY; renderApp(a); scrollTo(0, y);
  });
  scrollTo(0, 0);
}

function route() {
  closeMenu();
  const h = location.hash.slice(1);
  if (h === 'library') return renderLibrary();
  if (h === 'wishlist') return renderWishlist();
  const a = DATA.apps.find(x => x.id === h);
  a ? renderApp(a) : renderHome();
}
function goHome() { if (location.hash.length > 1) location.hash = ''; else renderHome(); }

document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; tab = b.dataset.tab; cat = null; goHome(); });
$('#views').addEventListener('click', e => { const b = e.target.closest('.vchip'); if (!b) return; view = b.dataset.view; cat = null; goHome(); });
$('#view').addEventListener('click', e => {
  const s = e.target.closest('[data-scroll]');
  if (s) { const r = document.getElementById(s.dataset.scroll); r.scrollBy({ left: s.dataset.dir * r.clientWidth * 0.8, behavior: 'smooth' }); return; }
  const c = e.target.closest('[data-chart]'); if (c) { chart = c.dataset.chart; renderHome(); return; }
  const k = e.target.closest('[data-cat]'); if (k) { cat = k.dataset.cat || null; renderHome(); }
});
$('#q').addEventListener('input', e => { query = e.target.value; goHome(); });
document.querySelector('.logo').addEventListener('click', () => { tab = 'app'; view = 'foryou'; query = ''; $('#q').value = ''; });
addEventListener('hashchange', route);
// downloads go into "My apps"
document.addEventListener('click', e => {
  const d = e.target.closest('[data-dl]'); if (!d) return;
  const a = DATA.apps.find(x => x.id === d.dataset.dl); if (!a) return;
  ACCT.library[a.id] = { version: a.version, date: new Date().toISOString().slice(0, 10) }; saveAcct();
  setTimeout(() => route(), 300);
});
// Copy buttons for the TV codes
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (!c) return;
  e.preventDefault();
  const t = c.dataset.copy, done = () => { c.textContent = 'Copied'; setTimeout(() => c.textContent = 'Copy', 1500); };
  navigator.clipboard?.writeText(t).then(done, done) ?? done();
});
// account menu
function closeMenu() { $('#menu').hidden = true; $('#acctBtn').setAttribute('aria-expanded', 'false'); }
$('#acctBtn').addEventListener('click', e => { e.stopPropagation(); const open = $('#menu').hidden; $('#menu').hidden = !open; $('#acctBtn').setAttribute('aria-expanded', String(open)); $('#clearNote').textContent = ''; });
document.addEventListener('click', e => { if (!e.target.closest('.acct')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
// sign-in (Firebase + Google). Turned on by filling in firebase-config.js
let FB = null, USER = null;
const loadScript = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
function renderWho() {
  const img = u => u.photoURL ? `<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">` : esc((u.displayName || u.email || '?')[0].toUpperCase());
  $('#whoAvatar').innerHTML = USER ? img(USER) : PERSON_SVG;
  $('#acctBtn').innerHTML = USER ? img(USER) : PERSON_SVG;
  $('#whoName').textContent = USER ? (USER.displayName || 'Signed in') : 'Guest';
  $('#whoSub').textContent = USER ? (USER.email || '') : (FB ? 'Not signed in' : 'Saved on this device only');
  $('#signinBtn').hidden = !!USER; $('#signoutBtn').hidden = !USER;
  $('#signinNote').textContent = USER ? 'My apps and Wishlist are saved to your account.' : 'Sign in to keep My apps and Wishlist on all your devices.';
}
function pushCloud() {
  if (!FB || !USER) return;
  FB.db.collection('users').doc(USER.uid).set({ library: ACCT.library, wishlist: ACCT.wishlist, updated: new Date().toISOString() }, { merge: true })
    .catch(() => { $('#signinNote').textContent = 'Could not save to your account. Your list is still saved on this device.'; });
}
async function initAuth() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey) return;
  try {
    const v = 'https://cdn.jsdelivr.net/npm/firebase@10.12.2/';
    await loadScript(v + 'firebase-app-compat.js');
    await Promise.all([loadScript(v + 'firebase-auth-compat.js'), loadScript(v + 'firebase-firestore-compat.js')]);
    firebase.initializeApp(cfg);
    FB = { auth: firebase.auth(), db: firebase.firestore() };
  } catch { $('#signinNote').textContent = 'Sign-in could not load. Check your connection and refresh.'; return; }
  renderWho();
  FB.auth.onAuthStateChanged(async u => {
    USER = u; renderWho();
    if (!u) return;
    try {
      const snap = await FB.db.collection('users').doc(u.uid).get();
      const r = snap.exists ? snap.data() : {};
      ACCT = { library: Object.assign({}, r.library || {}, ACCT.library), wishlist: [...new Set([...(r.wishlist || []), ...ACCT.wishlist])] };
      saveAcct(); route();
    } catch { $('#signinNote').textContent = 'Signed in, but your saved list could not load yet.'; }
  });
}
$('#signinBtn').addEventListener('click', () => {
  if (!FB) { $('#signinNote').textContent = 'Sign-in is not switched on yet. Your list is saved on this device.'; return; }
  FB.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
    if (e.code !== 'auth/popup-closed-by-user') $('#signinNote').textContent = 'Sign-in did not finish. Please try again.';
  });
});
$('#signoutBtn').addEventListener('click', () => {
  FB.auth.signOut().then(() => { ACCT = { library: {}, wishlist: [] }; try { localStorage.removeItem(KEY); } catch {} updateCounts(); route(); });
});
$('#clearData').addEventListener('click', () => {
  if ($('#clearData').dataset.armed) { ACCT = { library: {}, wishlist: [] }; saveAcct(); delete $('#clearData').dataset.armed; $('#clearNote').textContent = 'Cleared.'; route(); }
  else { $('#clearData').dataset.armed = '1'; $('#clearNote').textContent = 'Tap again to clear My apps and Wishlist.'; }
});

initAuth();
fetch('apps.json').then(r => r.json()).then(d => { DATA = d; updateCounts(); route(); })
  .catch(() => { $('#view').innerHTML = empty('Could not load the app list', 'Keep apps.json in the same folder as this page.'); });
</script>
</body>
</html>
