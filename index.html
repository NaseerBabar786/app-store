<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002a3e">
<title>Bulk Bazaar App Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky shelf header, category rail, featured banners, then a dense grid of app tiles; detail opens as its own view via #app-id */
:root {
  --bg: #F2F5F7;
  --surface: #FFFFFF;
  --ink: #0E1F2A;
  --muted: #55687A;
  --line: #D8E1E8;
  --accent: #002A3E;
  --accent-ink: #FFFFFF;
  --chip: #E4EBF0;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08141C; --surface: #0F1F2A; --ink: #E6EEF3; --muted: #93A6B5; --line: #1E3240;
  --accent: #5CC8F0; --accent-ink: #002A3E; --chip: #16293A; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #08141C; --surface: #0F1F2A; --ink: #E6EEF3; --muted: #93A6B5; --line: #1E3240;
  --accent: #5CC8F0; --accent-ink: #002A3E; --chip: #16293A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
.bar { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 18px var(--display); }
.brand b { font: 800 19px/1.1 var(--display); letter-spacing: -0.01em; }
.site { order: 3; color: var(--muted); font-weight: 500; text-decoration: none; font-size: 14px; }
.site:hover { color: var(--ink); }
.search { flex: 1 1 260px; max-width: 420px; position: relative; }
.search input { width: 100%; padding: 10px 14px 10px 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.search svg { position: absolute; left: 13px; top: 50%; translate: 0 -50%; color: var(--muted); }

.cats { display: flex; gap: 8px; overflow-x: auto; padding-block: 0 12px; scrollbar-width: none; }
.cat { flex: none; border: 1px solid transparent; background: var(--chip); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 14px; }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

main { padding-block: 24px 56px; display: grid; gap: 36px; }
h2 { font: 700 20px/1.2 var(--display); margin: 0 0 14px; letter-spacing: -0.01em; }
.hero h1 { font: 800 clamp(28px, 5vw, 44px)/1.05 var(--display); margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.hero p { margin: 6px 0 0; color: var(--muted); }

.featured { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.feat { position: relative; border-radius: 20px; padding: 22px; min-height: 170px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; text-decoration: none; color: #fff; overflow: hidden; background: var(--c); }
.feat::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 200px; height: 200px; border-radius: 48px; background: rgba(255,255,255,.12); rotate: 18deg; }
.feat .eyebrow { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.feat h3 { font: 800 26px/1.1 var(--display); margin: 4px 0 0; }
.feat p { margin: 4px 0 0; opacity: .9; }
.feat .row { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tile { display: flex; gap: 14px; padding: 14px; border-radius: var(--r); text-decoration: none; background: var(--surface); border: 1px solid var(--line); transition: border-color .15s, transform .15s; min-width: 0; }
.tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.tile .meta { min-width: 0; display: grid; gap: 2px; align-content: start; }
.tile b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile small { font: 500 11.5px var(--mono); color: var(--muted); margin-top: 4px; }

.icon { flex: none; width: 64px; height: 64px; border-radius: 16px; background: var(--c); color: #fff; display: grid; place-items: center; font: 800 30px var(--display); box-shadow: inset 0 -6px 0 rgba(0,0,0,.12); overflow: hidden; }
.icon img { width: 100%; height: 100%; object-fit: cover; }
.icon.lg { width: 104px; height: 104px; border-radius: 26px; font-size: 50px; }
.icon.sm { width: 52px; height: 52px; border-radius: 14px; font-size: 24px; background: rgba(255,255,255,.2); box-shadow: none; }
.tag { display: inline-block; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--muted); }
.empty { color: var(--muted); padding: 32px 0; }

/* detail */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 500; }
.dhead { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.dhead h1 { font: 800 clamp(28px, 5vw, 40px)/1.05 var(--display); margin: 0; letter-spacing: -0.02em; }
.dhead .dev { color: var(--accent); font-weight: 600; }
.dhead .sub { color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; border-block: 1px solid var(--line); }
.fact { flex: 1 1 120px; padding: 12px 16px; text-align: center; border-right: 1px solid var(--line); }
.fact:last-child { border-right: 0; }
.fact b { display: block; font: 600 15px var(--body); font-variant-numeric: tabular-nums; }
.fact small { color: var(--muted); font-size: 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px; text-decoration: none; font-weight: 600; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.prose { max-width: 65ch; display: grid; gap: 22px; }
.prose p { margin: 0; }
.notice { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } .fact { flex-basis: 45%; border-right: 0; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#"><span class="mark" id="mark">B</span><b id="storeName">App Store</b></a>
      <a class="site" id="site" href="https://www.bulkbazaar.ca" target="_blank" rel="noopener" hidden>bulkbazaar.ca ↗</a>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search apps" aria-label="Search apps"></label>
    </div>
    <nav class="cats" id="cats" aria-label="Categories"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>
const FALLBACK_NOTE = 'Could not load apps.json. Keep apps.json in the same folder as this page.';
let DATA = { store: {}, apps: [] }, cat = 'All', query = '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LINK_LABELS = { web: 'Open web app', android: 'Download for Android', ios: 'Get for iPhone', windows: 'Download for Windows', mac: 'Download for Mac', source: 'View source code' };

function icon(a, cls = '') {
  const c = a.icon?.color || '#0B6E4F';
  const inner = a.icon?.image ? `<img src="${esc(a.icon.image)}" alt="">` : esc(a.icon?.letter || a.name[0]);
  return `<span class="icon ${cls}" style="--c:${esc(c)}">${inner}</span>`;
}
function fmtDate(d) { try { return new Date(d + 'T00:00').toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch { return d; } }

function renderCats() {
  const cats = ['All', ...new Set(DATA.apps.map(a => a.category))].sort((a, b) => a === 'All' ? -1 : b === 'All' ? 1 : a.localeCompare(b));
  $('#cats').innerHTML = cats.map(c => `<button class="cat" aria-pressed="${c === cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
}

function matches(a) {
  const q = query.trim().toLowerCase();
  return (cat === 'All' || a.category === cat) &&
    (!q || [a.name, a.tagline, a.category, a.description].join(' ').toLowerCase().includes(q));
}

function tile(a) {
  return `<a class="tile" href="#${esc(a.id)}">${icon(a)}<span class="meta">
    <b>${esc(a.name)}</b><span>${esc(a.tagline)}</span>
    <small>${esc(a.category)} · v${esc(a.version)}</small></span></a>`;
}

function renderHome() {
  const list = DATA.apps.filter(matches);
  const browsing = cat === 'All' && !query.trim();
  const feats = browsing ? DATA.apps.filter(a => a.featured) : [];
  const hasExamples = DATA.apps.some(a => a.example);
  $('#view').innerHTML = `
    ${browsing ? `<section class="hero"><h1>${esc(DATA.store.tagline || 'All my apps')}</h1>
      <p>${DATA.apps.length} apps by ${esc(DATA.store.developer || '')}</p></section>` : ''}
    ${hasExamples && browsing ? `<p class="notice">These are example listings. Replace them with your real apps in apps.json.</p>` : ''}
    ${feats.length ? `<section><h2>Featured</h2><div class="featured">${feats.map(a => `
      <a class="feat" href="#${esc(a.id)}" style="--c:${esc(a.icon?.color)}">
        <div><div class="eyebrow">${esc(a.category)}${a.example ? ' · example' : ''}</div><h3>${esc(a.name)}</h3><p>${esc(a.tagline)}</p></div>
        <div class="row">${icon(a, 'sm')}<span>v${esc(a.version)} · ${esc(a.platforms.join(', '))}</span></div></a>`).join('')}</div></section>` : ''}
    <section><h2>${browsing ? 'All apps' : `${list.length} result${list.length === 1 ? '' : 's'}`}</h2>
      ${list.length ? `<div class="grid">${list.map(tile).join('')}</div>` : `<p class="empty">No apps match "${esc(query)}". Try another word or pick All.</p>`}
    </section>`;
}

function renderDetail(a) {
  const links = Object.entries(a.links || {});
  const [first, ...rest] = links;
  const btn = ([k, url], primary) => `<a class="btn ${primary ? 'primary' : ''}" href="${esc(url)}" target="_blank" rel="noopener">${esc(LINK_LABELS[k] || k)}</a>`;
  const more = DATA.apps.filter(x => x.category === a.category && x.id !== a.id).slice(0, 4);
  $('#view').innerHTML = `
    <a class="back" href="#">← All apps</a>
    <section class="dhead">${icon(a, 'lg')}<div>
      <h1>${esc(a.name)}</h1>
      <div class="dev">${esc(DATA.store.developer || '')}</div>
      <div class="sub">${esc(a.tagline)} ${a.example ? '<span class="tag">Example</span>' : ''}</div></div></section>
    <div class="facts">
      <div class="fact"><b>${esc(a.version)}</b><small>Version</small></div>
      ${a.size ? `<div class="fact"><b>${esc(a.size)}</b><small>Size</small></div>` : ''}
      <div class="fact"><b>${esc(fmtDate(a.updated))}</b><small>Updated</small></div>
      <div class="fact"><b>${esc(a.category)}</b><small>Category</small></div>
      <div class="fact"><b>${esc(a.platforms[0])}</b><small>${a.platforms.length > 1 ? 'and ' + esc(a.platforms.slice(1).join(', ')) : 'Platform'}</small></div>
    </div>
    ${links.length ? `<div class="actions">${btn(first, true)}${rest.map(l => btn(l, false)).join('')}</div>` : ''}
    <section class="prose">
      <div><h2>About this app</h2><p>${esc(a.description)}</p></div>
      ${a.whatsNew ? `<div><h2>What's new</h2><p>${esc(a.whatsNew)}</p></div>` : ''}
      <div><h2>Available on</h2><p>${a.platforms.map(p => `<span class="tag">${esc(p)}</span>`).join(' ')}</p></div>
    </section>
    ${more.length ? `<section><h2>More in ${esc(a.category)}</h2><div class="grid">${more.map(tile).join('')}</div></section>` : ''}`;
  scrollTo(0, 0);
}

function route() {
  const id = location.hash.slice(1);
  const app = DATA.apps.find(a => a.id === id);
  $('#cats').hidden = !!app;
  app ? renderDetail(app) : renderHome();
}

$('#cats').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return;
  cat = b.dataset.c; renderCats();
  if (location.hash.length > 1) location.hash = ''; else renderHome();
});
$('#q').addEventListener('input', e => {
  query = e.target.value;
  if (location.hash.length > 1) location.hash = ''; else renderHome();
});
addEventListener('hashchange', route);

fetch('apps.json').then(r => r.json()).then(d => {
  DATA = d;
  document.title = d.store.name || document.title;
  $('#storeName').textContent = d.store.name || 'App Store';
  $('#mark').textContent = (d.store.name || 'A')[0];
  if (d.store.website) { $('#site').href = d.store.website; $('#site').textContent = d.store.website.replace(/^https?:\/\/(www\.)?/, '') + ' ↗'; $('#site').hidden = false; }
  renderCats(); route();
}).catch(() => { $('#view').innerHTML = `<p class="empty">${FALLBACK_NOTE}</p>`; });
</script>
</body>
</html>
